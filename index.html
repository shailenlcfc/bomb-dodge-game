<!DOCTYPE html>
<html>
	<head>
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Bomb Dodge - Shailen Patel</title>
		<link rel="stylesheet" href="style.css">
		<script src="game.js"></script>
	</head>

	<body>

		
		<div class="hud">
			<ul class="health">
				<li></li>
				<li></li>
				<li></li>
			</ul>
		</div>

		<div id="startbutton" class="start">
			Start
		</div>

		<div class="sky">

		</div>

		<div  id="gameoverbutton" class="start" style="visibility: hidden;">
			game over
		</div>
		
		<div id="player" class="character stand down">
			<div class="head">
			</div>

			<div class="body">
			</div>

			<div class="weapon bow">
			</div>

		</div>
		<div class="grass">


		</div>

		<!-- On-screen arrow buttons, only shown on touch devices (see style.css) -->
		<div id="touchcontrols" class="touchcontrols">
			<div class="touchgroup">
				<button class="touchbutton" data-keycode="37" aria-label="Left">&#9664;</button>
				<button class="touchbutton" data-keycode="39" aria-label="Right">&#9654;</button>
			</div>
			<div class="touchgroup">
				<button class="touchbutton" data-keycode="38" aria-label="Up">&#9650;</button>
				<button class="touchbutton" data-keycode="40" aria-label="Down">&#9660;</button>
			</div>
		</div>
		


	</body>
</html>
